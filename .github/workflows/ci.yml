name: MGR Quality Gates & Thresholds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP for backend syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Install dependencies
        run: npm ci

      - name: Lint PHP backend (php -l)
        run: php -l public/api.php

      - name: Production Vite build
        run: npm run build

      - name: Run MGR Quality Gates & Threshold Test Suite
        run: npm test
